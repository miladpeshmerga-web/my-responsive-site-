<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شیکاری ئامێرەکەت</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background-color: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            border: 1px solid #334155;
        }
        h2 {
            color: #38bdf8;
            margin-top: 0;
            font-size: 1.4rem;
            text-align: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
        }
        .info-group {
            margin-bottom: 14px;
            background: #0f172a;
            padding: 12px;
            border-radius: 10px;
        }
        .label {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }
        .value {
            color: #f1f5f9;
            font-weight: 600;
            font-size: 0.95rem;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🔍 زانیارییەکانی ئامێرەکەت</h2>
        
        <div class="info-group">
            <div class="label">📱 جۆری ئامێر / سیستەم:</div>
            <div class="value" id="platform">لە حاڵەتی خەمڵاندندایە...</div>
        </div>

        <div class="info-group">
            <div class="label">🌐 دەقی User-Agent:</div>
            <div class="value" id="userAgent">...</div>
        </div>

        <div class="info-group">
            <div class="label">📐 ڕوونی شاشە (Resolution):</div>
            <div class="value" id="screenRes">...</div>
        </div>

        <div class="info-group">
            <div class="label">🎮 کارتی گرافیک (GPU WebGL):</div>
            <div class="value" id="gpu">...</div>
        </div>
    </div>

    <script>
        // 1. User Agent
        document.getElementById('userAgent').innerText = navigator.userAgent;

        // 2. Platform / System
        document.getElementById('platform').innerText = navigator.platform;

        // 3. Screen Resolution
        document.getElementById('screenRes').innerText = `${window.screen.width} x ${window.screen.height} (Pixel Ratio: ${window.devicePixelRatio})`;

        // 4. WebGL GPU Detection
        try {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (gl) {
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                const renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                document.getElementById('gpu').innerText = renderer;
            } else {
                document.getElementById('gpu').innerText = 'WebGL نەدۆزرایەوە';
            }
        } catch (e) {
            document.getElementById('gpu').innerText = 'نەتوانرا بخوێندرێتەوە';
        }
    </script>

</body>
</html>
