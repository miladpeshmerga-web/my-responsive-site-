<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماڵپەڕی ڕیسپۆنسیڤ</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 {
            color: #1a1a1a;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 1rem;
            line-height: 1.6;
        }
        .device-badge {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 16px;
            background-color: #e8f0fe;
            color: #1a73e8;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>بەخێربێیت! 👋</h1>
        <p>ئەم لاپەڕەیە بەپێی ئامێرەکەت (مۆبایل یان کۆمپیوتەر) خۆی گونجاندووە.</p>
        <div class="device-badge">Responsive Design 📱💻</div>
    </div>

</body>
</html>
